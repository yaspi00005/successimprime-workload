security:

    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'


    providers:

        app_user_provider:
            entity:
                class: App\Entity\User
                property: username

        comptes_clients:
            entity:
                class: App\Entity\CompteClient
                property: telephone


    firewalls:

        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false


        # Synchronisation : seul l'agent de l'ERP local appelle ces adresses,
        # chaque requête est signée (docs/synchronisation.md). Pas de session.
        synchro:
            pattern: ^/api/synchro/
            stateless: true
            security: false

        # API (docs/api.md) : un jeton par personne et par usage, sans
        # session. Fermée sur le serveur en ligne (ApiHorsLigneSubscriber).
        api:
            pattern: ^/api/v1
            stateless: true
            provider: app_user_provider
            custom_authenticator: App\Security\JetonApiAuthenticator
            entry_point: App\Security\JetonApiAuthenticator
            user_checker: App\Security\UserChecker

        # Espace client (maquettes CX01 et CX04) : comptes séparés du
        # personnel, connexion par numéro de téléphone.
        espace:
            pattern: ^/espace
            lazy: true
            provider: comptes_clients
            custom_authenticator: App\Security\EspaceClientAuthenticator
            entry_point: App\Security\EspaceClientAuthenticator
            user_checker: App\Security\EspaceClientChecker
            logout:
                path: app_espace_deconnexion
                target: app_espace_connexion
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 2592000
                path: /espace
                name: SI_ESPACE_SOUVENIR
                # « Déconnecter les autres appareils » (versionSession) annule aussi ces cookies.
                signature_properties: [password, versionSession]
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

        main:
            lazy: true
            provider: app_user_provider

            custom_authenticator:
                App\Security\UserAuthenticator

            user_checker:
                App\Security\UserChecker

            logout:
                path: app_logout

            # Limite les tentatives de connexion successives (par
            # nom d'utilisateur et par IP) pour ralentir une attaque
            # par force brute sur les mots de passe.
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'


    # ================================================================
    # HIÉRARCHIE DES RÔLES
    # ================================================================

    role_hierarchy:

        ROLE_ADMIN:
            - ROLE_USER
            - ROLE_CLIENT
            - ROLE_DEVIS
            - ROLE_COMMANDE
            - ROLE_FACTURE

            - ROLE_PAIEMENT_VOIR
            - ROLE_PAIEMENT_ENCAISSER

            - ROLE_TRESORERIE_VOIR
            - ROLE_TRESORERIE_SAISIR
            - ROLE_TRESORERIE_TRANSFERER
            - ROLE_JOURNAL_CAISSE

            - ROLE_PREPRESSE
            - ROLE_PRODUCTION_VOIR
            - ROLE_PRODUCTION_GERER

            - ROLE_LIVRAISON
            - ROLE_ENTRETIEN
            - ROLE_STATS_GLOBAL
            - ROLE_STATS_PERSO
            - ROLE_STATS_VENTES
            - ROLE_COUT_MARGE
            - ROLE_RH
            - ROLE_PARAMETRES
            - ROLE_ACTIONS_GERER
            - ROLE_RESPONSABLE_GESTION
            - ROLE_SITE_VITRINE
            - ROLE_PROMOTIONS
            - ROLE_COMPTABILITE
            - ROLE_ASSISTANT
            


        # Les autres roles (caisse, graphiste, production, livreur et
        # ceux crees dans Reglages, Roles et droits) n'heritent de rien
        # ici : leurs droits sont en base (role_utilisateur), plus ou
        # moins ceux coches pour chaque personne. Voir User::getRoles().

    access_control:


        # ============================================================
        # PUBLIC
        # ============================================================

        - {
            path: ^/login$,
            roles: PUBLIC_ACCESS
        }

        - {
            path: ^/lockscreen$,
            roles: PUBLIC_ACCESS
        }

        - {
            path: ^/changer-utilisateur$,
            roles: PUBLIC_ACCESS
        }

        # Site vitrine (maquettes 01 à 12, docs/site-vitrine.md). « / » est
        # l'accueil du site pour un visiteur en ligne ; sinon le tableau de
        # bord, qui renvoie lui-même vers la connexion (DashboardController).
        - {
            path: '^/$',
            roles: PUBLIC_ACCESS
        }

        - {
            path: '^/(site|nos-produits|calculateur|realisations|equipements|guide-fichiers|a-propos|nos-engagements|faq|suivre-ma-commande|contact|conseils|demander-un-devis)(/|$)',
            roles: PUBLIC_ACCESS
        }

        - {
            path: '^/(sitemap\.xml|robots\.txt)$',
            roles: PUBLIC_ACCESS
        }

        # Assistant du site (docs/assistant-client.md) : questions des visiteurs
        # sans compte, en JSON, sans session.
        - {
            path: '^/assistant/(message|note|historique)$',
            roles: PUBLIC_ACCESS
        }

        # Espace client : connexion, création de compte et suivi sans compte
        - {
            path: ^/espace/(connexion|code|creer-compte|suivre)$,
            roles: PUBLIC_ACCESS
        }

        - {
            path: ^/espace,
            roles: ROLE_ESPACE_CLIENT
        }

        # Enrôlement d'un appareil pour l'administration en ligne (QR de 5 min)
        - {
            path: '^/appareil/autoriser/[0-9a-f]{48}$',
            roles: PUBLIC_ACCESS
        }

        # Orange Money prévient le site après un paiement de l'espace client ;
        # la notification n'est crue qu'avec le jeton reçu à l'ouverture.
        - {
            path: '^/om/notification/SI[0-9A-F]{18}$',
            roles: PUBLIC_ACCESS
        }

        - {
            path: ^/ecran-accueil,
            roles: PUBLIC_ACCESS
        }

        # Sondages sans compte (docs/sondages.md) : lien reçu à la
        # livraison, lien ou QR code d'un sondage libre.
        - {
            path: '^/avis/[cs]/[0-9a-f]{24}$',
            roles: PUBLIC_ACCESS
        }

        # Employés (maquette E05) : activation par le lien WhatsApp,
        # connexion par PIN sur le téléphone enregistré, tablette de
        # l'entrée (branchée par la RH, reconnue par son cookie).
        - {
            path: '^/acces/(activer/[0-9a-f]{48}|pin)$',
            roles: PUBLIC_ACCESS
        }

        - {
            path: '^/tablette(/\d+)?$',
            roles: PUBLIC_ACCESS
        }

        - {
            path: '^/f/[2-9A-HJ-NP-Z]{4}-[2-9A-HJ-NP-Z]{2}$',
            roles: PUBLIC_ACCESS
        }

        - {
            path: ^/factures/\d+/pdf-public/,
            roles: PUBLIC_ACCESS
        }

        - {
            path: ^/devis/\d+/pdf-public/,
            roles: PUBLIC_ACCESS
        }


        # API : la documentation ne contient aucune donnée ; le reste
        # demande un jeton, puis chaque ressource vérifie les droits fins.
        - {
            path: '^/api/v1(/docs(\.[a-z]+)?|/index(\.[a-z]+)?|/contexts/.*|/\.well-known/.*)?$',
            roles: PUBLIC_ACCESS
        }

        - {
            path: ^/api/v1,
            roles: ROLE_USER
        }


        # ============================================================
        # COMPTE PERSONNEL
        # ============================================================

        - {
            path: ^/user/mon-compte/changer-mot-de-passe$,
            roles: ROLE_USER
        }


        # ============================================================
        # UTILISATEURS / ADMIN
        # ============================================================

        - {
            path: ^/user,
            roles: ROLE_ADMIN
        }

        - {
            path: ^/admin,
            roles: ROLE_ADMIN
        }

        - {
            path: ^/journal-activite,
            roles: ROLE_ADMIN
        }


        # ============================================================
        # PARAMÈTRES
        # ============================================================

        - {
            path: ^/(categorie-produit|produits|produit-configuration|type-impression|support|format|finition|machines|lot-etiquette),
            roles: ROLE_ADMIN
        }


        # ============================================================
        # RH
        # ============================================================

        - {
            path: ^/(rh|employes),
            roles: ROLE_ADMIN
        }


        # ============================================================
        # ARTICLE EN STOCK -- AJAX UTILISE PAR LA COMMANDE ET LE DEVIS
        #
        # Doit rester accessible a ROLE_COMMANDE (donc a un compte
        # caisse) : c'est l'endpoint que le formulaire de commande/devis
        # appelle pour charger stock/prix/reference d'un article
        # vendable. Placee AVANT la regle generale ADMIN UNIQUEMENT
        # ci-dessous, car Symfony applique la premiere regle qui
        # correspond.
        # ============================================================

        - {
            path: ^/articles/\d+/commande/ajax,
            roles: ROLE_COMMANDE
        }


        # ============================================================
        # STOCK
        #
        # ADMIN UNIQUEMENT
        # ============================================================

        - {
            path: ^/(stock|stocks|article|articles|inventaire),
            roles: ROLE_ADMIN
        }


        # ============================================================
        # ACHATS / FOURNISSEURS
        #
        # ADMIN UNIQUEMENT POUR LE MOMENT
        # ============================================================

        - {
            path: ^/(fournisseur|fournisseurs|achat|achats),
            roles: ROLE_ADMIN
        }


        # ============================================================
        # STATISTIQUES GLOBALES
        #
        # Couvre toutes les sous-pages (globales, commandes,
        # tresorerie, clients...), toutes reservees a l'administrateur
        # via ROLE_STATS_GLOBAL.
        # ============================================================

        - {
            path: ^/statistiques,
            roles: ROLE_STATS_GLOBAL
        }


        # ============================================================
        # STATISTIQUES PERSONNELLES
        # ============================================================

        - {
            path: ^/mes-statistiques,
            roles: ROLE_STATS_PERSO
        }


        # ============================================================
        # CLIENTS
        # ============================================================

        - {
            path: ^/clients,
            roles: ROLE_CLIENT
        }


        # ============================================================
        # DEVIS
        # ============================================================

        - {
            path: ^/devis,
            roles: ROLE_DEVIS
        }


        # ============================================================
        # COMMANDES
        # ============================================================

        - {
            path: ^/commandes,
            roles: ROLE_COMMANDE
        }


        # ============================================================
        # FACTURES
        # ============================================================

        - {
            path: ^/factures,
            roles: ROLE_FACTURE
        }


        # ============================================================
        # PAIEMENTS
        #
        # ÉCRITURE / ENCAISSEMENT EN PREMIER
        # ============================================================

        - {
            path: ^/paiements/new$,
            roles: ROLE_PAIEMENT_ENCAISSER
        }


        - {
            path: ^/paiements/\d+/edit$,
            roles: ROLE_PAIEMENT_ENCAISSER
        }


        - {
            path: ^/paiements/\d+/delete$,
            roles: ROLE_PAIEMENT_ENCAISSER
        }


        - {
            path: ^/paiements/\d+$,
            methods: [POST, PUT, PATCH, DELETE],
            roles: ROLE_PAIEMENT_ENCAISSER
        }


        # ============================================================
        # CONSULTATION PAIEMENTS
        # ============================================================

        - {
            path: ^/paiements,
            methods: [GET],
            roles: ROLE_PAIEMENT_VOIR
        }


        # ============================================================
        # TRÉSORERIE - SAISIE
        #
        # CAISSE / ADMIN UNIQUEMENT
        # ============================================================

        - {
            path: ^/gestion/tresorerie/(encaissements|decaissements),
            roles: ROLE_TRESORERIE_SAISIR
        }


        # ============================================================
        # MOUVEMENTS DE TRÉSORERIE - ÉCRITURE
        # ============================================================

        - {
            path: ^/gestion/tresorerie/mouvements/new$,
            roles: ROLE_TRESORERIE_SAISIR
        }


        - {
            path: ^/gestion/tresorerie/mouvements/\d+/(edit|validate|cancel)$,
            roles: ROLE_TRESORERIE_SAISIR
        }


        # ============================================================
        # COMPTES DE TRÉSORERIE
        # ============================================================

        - {
            path: ^/gestion/tresorerie/comptes,
            roles: ROLE_TRESORERIE_VOIR
        }


        # ============================================================
        # CONSULTATION MOUVEMENTS TRÉSORERIE
        # ============================================================

        - {
            path: ^/gestion/tresorerie/mouvements,
            methods: [GET],
            roles: ROLE_TRESORERIE_VOIR
        }


        # ============================================================
        # JOURNAL DE CAISSE
        # ============================================================

        - {
            path: ^/gestion/tresorerie/journal-caisse,
            roles: ROLE_JOURNAL_CAISSE
        }


        # ============================================================
        # TRANSFERT DE TRÉSORERIE
        #
        # ADMIN UNIQUEMENT POUR LE MOMENT
        # ============================================================

        - {
            path: ^/gestion/tresorerie/transferts,
            roles: ROLE_ADMIN
        }


        # ============================================================
        # RAPPROCHEMENT BANCAIRE
        #
        # ADMIN UNIQUEMENT
        # ============================================================

        - {
            path: ^/rapprochements-bancaires,
            roles: ROLE_ADMIN
        }


        # ============================================================
        # PRÉPRESSE
        #
        # INFOGRAPHISTE + ADMIN UNIQUEMENT
        # ============================================================

        - {
            path: ^/controle-pre-presse,
            roles: ROLE_PREPRESSE
        }


        - {
            path: ^/production/prepresse,
            roles: ROLE_PREPRESSE
        }


        # ============================================================
        # PRODUCTION
        # ============================================================

        - {
            path: ^/production,
            roles: ROLE_PRODUCTION_VOIR
        }


        # ============================================================
        # CONSOMMABLES
        #
        # Retire directement du stock disponible : reserve aux
        # profils production (avant, tout utilisateur connecte y
        # avait acces par defaut).
        # ============================================================

        - {
            path: ^/consommables,
            roles: ROLE_PRODUCTION_GERER
        }


        # ============================================================
        # LIVRAISON
        # ============================================================

        - {
            path: ^/(livraisons|bons-livraison),
            roles: ROLE_LIVRAISON
        }


        # ============================================================
        # FALLBACK
        # ============================================================

        - {
            path: ^/,
            roles: ROLE_USER
        }


when@test:

    security:

        password_hashers:

            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:

                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10