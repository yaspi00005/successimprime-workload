<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout : bandeau collant (marque, recherche, onglets), puis une colonne de travail ; les listes longues se chargent par tranches. */
:root {
  --bg: #f3f6f7;
  --surface: #ffffff;
  --sunken: #e9eef0;
  --ink: #13212a;
  --muted: #566871;
  --line: #d5dee2;
  --line-strong: #b7c5cb;
  --accent: #0a6a86;
  --accent-ink: #ffffff;
  --accent-soft: #dcedf2;
  --ok: #1d7646;
  --ok-soft: #dcf0e4;
  --bad: #b02a20;
  --bad-soft: #f8e0dd;
  --ask: #8a5a00;
  --ask-soft: #f8ebcf;
  --warn: #9a4f00;
  --code-bg: #eef3f5;
  --shadow: 0 1px 2px rgba(19, 33, 42, .06), 0 4px 14px rgba(19, 33, 42, .05);
  --f-sans: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-cond: "IBM Plex Sans Condensed", "Arial Narrow", "Roboto Condensed", "IBM Plex Sans", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e161b; --surface: #152129; --sunken: #1b2a33; --ink: #e2ebee; --muted: #93a6af;
    --line: #253740; --line-strong: #35505c; --accent: #5cbcd8; --accent-ink: #062530; --accent-soft: #163946;
    --ok: #5ccf93; --ok-soft: #173a29; --bad: #f2877c; --bad-soft: #43201d; --ask: #f0b955; --ask-soft: #3d2f12;
    --warn: #f0a050; --code-bg: #1a2a33; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e161b; --surface: #152129; --sunken: #1b2a33; --ink: #e2ebee; --muted: #93a6af;
  --line: #253740; --line-strong: #35505c; --accent: #5cbcd8; --accent-ink: #062530; --accent-soft: #163946;
  --ok: #5ccf93; --ok-soft: #173a29; --bad: #f2877c; --bad-soft: #43201d; --ask: #f0b955; --ask-soft: #3d2f12;
  --warn: #f0a050; --code-bg: #1a2a33; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-sans); margin: 0; overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
code, .mono { font-family: var(--f-mono); font-size: .86em; overflow-wrap: anywhere; }
code { background: var(--code-bg); padding: .08em .35em; border-radius: 4px; overflow-wrap: anywhere; }
h1, h2, h3, h4 { font-family: var(--f-cond); line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: 1.9rem; font-weight: 700; letter-spacing: -.01em; }
h2 { font-size: 1.35rem; font-weight: 600; }
h3 { font-size: 1.08rem; font-weight: 600; }
p { margin: 0; overflow-wrap: anywhere; }
.row .d, .small { overflow-wrap: anywhere; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.inner { max-width: 1240px; margin: 0 auto; }

/* Bandeau */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 12px; padding-block: 10px 8px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); min-width: 0; }
.brand svg { flex: none; color: var(--accent); }
.brand b { font-family: var(--f-cond); font-size: 1.05rem; font-weight: 700; white-space: nowrap; }
.brand span { color: var(--muted); font-size: .8rem; white-space: nowrap; }
.search { flex: 1; min-width: 0; max-width: 520px; margin-left: auto; position: relative; }
.search input { width: 100%; font: inherit; font-size: .95rem; padding: 7px 12px 7px 34px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--bg); color: var(--ink); }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.iconbtn { flex: none; font: inherit; font-size: .8rem; display: inline-flex; align-items: center; gap: 6px; padding: 6px 9px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); color: var(--muted); cursor: pointer; }
.iconbtn:hover { color: var(--ink); border-color: var(--line-strong); }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 0; margin-bottom: -1px; }
.tabs a { flex: none; padding: 7px 10px 8px; font-size: .86rem; font-weight: 500; color: var(--muted); text-decoration: none; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); }
.tabs a .n { font-family: var(--f-mono); font-size: .72rem; color: var(--muted); margin-left: 4px; font-variant-numeric: tabular-nums; }
.dbstate { font-size: .75rem; color: var(--muted); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.dbstate i { width: 8px; height: 8px; border-radius: 50%; background: var(--line-strong); display: inline-block; }
.dbstate[data-s="on"] i { background: var(--ok); }
.dbstate[data-s="ro"] i { background: var(--ask); }

/* Corps */
main { padding-block: 22px 64px; }
.view { display: grid; gap: 22px; grid-template-columns: minmax(0, 1fr); }
.view > *, .head > *, .panel > * { min-width: 0; }
.head { display: grid; gap: 6px; grid-template-columns: minmax(0, 1fr); }
.eyebrow { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.lead { color: var(--muted); max-width: 72ch; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.panel > h2, .panel > h3 { margin-bottom: 10px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.cols > * { min-width: 0; }
.kv { margin: 0; display: grid; grid-template-columns: minmax(0, max-content) minmax(0, 1fr); gap: 6px 16px; font-size: .9rem; }
.kv dt { color: var(--muted); overflow-wrap: anywhere; min-width: 0; }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.dim { color: var(--muted); }
.small { font-size: .82rem; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { display: inline-block; font-family: var(--f-mono); font-size: .74rem; padding: 1px 6px; border-radius: 4px; background: var(--sunken); color: var(--ink); white-space: nowrap; }
.tag.m { background: var(--accent-soft); }
.tag.w { background: var(--bad-soft); color: var(--bad); }
.tag.a { background: var(--ask-soft); color: var(--ask); }
.tag.g { background: var(--ok-soft); color: var(--ok); }
a.tag { text-decoration: none; }

/* Tuiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.tile { display: grid; gap: 2px; align-content: start; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); text-decoration: none; color: var(--ink); }
a.tile:hover { border-color: var(--accent); }
.tile .v { font-family: var(--f-cond); font-size: 1.7rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.tile .l { font-size: .84rem; font-weight: 500; }
.tile .s { font-size: .75rem; color: var(--muted); }

/* Tableaux */
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .86rem; }
th, td { text-align: left; vertical-align: top; padding: 7px 10px; border-bottom: 1px solid var(--line); }
th { font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; background: var(--sunken); position: sticky; top: 0; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td .mono { overflow-wrap: anywhere; }
td.nw { white-space: nowrap; }
.yes { color: var(--ok); font-weight: 600; }
.no { color: var(--muted); }
.warn { color: var(--bad); font-weight: 600; }

/* Filtres */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filters input[type="search"], .filters select { font: inherit; font-size: .88rem; padding: 6px 10px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); color: var(--ink); min-width: 0; }
.filters input[type="search"] { flex: 1 1 220px; }
.filters label { font-size: .85rem; display: inline-flex; gap: 5px; align-items: center; color: var(--muted); }
.count { font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.more { font: inherit; font-size: .85rem; margin: 10px auto 0; display: block; padding: 7px 14px; border-radius: var(--r); border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); cursor: pointer; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { font: inherit; font-size: .84rem; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); cursor: pointer; font-variant-numeric: tabular-nums; }
.pill[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Listes de liens */
.list { display: grid; gap: 0; }
.list a.row, .list div.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 9px 12px; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink); min-width: 0; }
.list a.row:hover { background: var(--sunken); }
.list .row:last-child { border-bottom: 0; }
.row .t { font-family: var(--f-mono); font-size: .86rem; font-weight: 500; overflow-wrap: anywhere; min-width: 0; }
.row .d { grid-column: 1 / -1; font-size: .83rem; color: var(--muted); }

/* Chapitres */
.chap { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 24px; align-items: start; }
.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 100px); display: grid; gap: 2px; }
.toc a { padding: 6px 10px; border-radius: var(--r); text-decoration: none; color: var(--ink); font-size: .9rem; }
.toc a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.toc .sub { padding-left: 20px; font-size: .8rem; color: var(--muted); }
.md { max-width: 80ch; min-width: 0; }
.md h1 { font-size: 1.9rem; margin: 0 0 14px; }
.md h2 { margin: 30px 0 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.md h3 { margin: 22px 0 8px; }
.md p, .md ul, .md ol { margin: 0 0 12px; }
.md li { margin: 3px 0; }
.md .tbl { margin: 0 0 16px; max-width: none; }
.md table { font-size: .82rem; }
.md table code { font-size: .8rem; }
.md pre { background: var(--code-bg); padding: 12px; border-radius: var(--r); overflow-x: auto; }
.md blockquote { margin: 0 0 12px; padding: 4px 14px; border-left: 3px solid var(--line-strong); color: var(--muted); }
.md a code { color: var(--accent); }

/* Modules */
.mods { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.mod { display: grid; gap: 8px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); text-decoration: none; color: var(--ink); }
.mod:hover { border-color: var(--accent); }
.mod h3 { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.mod .nums { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.mod .nums b { color: var(--ink); font-weight: 600; }

/* Relations */
.rel { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 12px; align-items: center; }
.rel .col { display: grid; gap: 6px; min-width: 0; }
.rel .center { font-family: var(--f-mono); font-weight: 600; padding: 10px 14px; border: 2px solid var(--accent); border-radius: var(--r); background: var(--accent-soft); text-align: center; overflow-wrap: anywhere; }
.rel .node { display: flex; gap: 6px; align-items: center; justify-content: space-between; padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); font-size: .83rem; min-width: 0; }
.rel .node a { font-family: var(--f-mono); overflow-wrap: anywhere; min-width: 0; }
.rel .lbl { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }

/* Audit */
.aw { border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); padding: 12px; display: grid; gap: 9px; }
.aw[data-st="confirme"] { border-color: var(--ok); }
.aw[data-st="a_corriger"] { border-color: var(--bad); }
.aw[data-st="question"] { border-color: var(--ask); }
.aw-top { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.aw-top .eyebrow { color: var(--accent); }
.aw-q { font-size: .9rem; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { font: inherit; font-size: .85rem; font-weight: 500; padding: 6px 12px; border-radius: var(--r); border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.seg button::before { content: ""; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid currentColor; }
.seg button[data-v="confirme"] { color: var(--ok); }
.seg button[data-v="a_corriger"] { color: var(--bad); }
.seg button[data-v="question"] { color: var(--ask); }
.seg button[aria-pressed="true"][data-v="confirme"] { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.seg button[aria-pressed="true"][data-v="a_corriger"] { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.seg button[aria-pressed="true"][data-v="question"] { background: var(--ask); border-color: var(--ask); color: var(--surface); }
.seg button[aria-pressed="true"]::before { background: currentColor; }
.seg button:disabled { cursor: not-allowed; opacity: .6; }
.aw textarea { font: inherit; font-size: .88rem; width: 100%; min-height: 54px; resize: vertical; padding: 7px 10px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--bg); color: var(--ink); }
.aw textarea[readonly] { background: var(--sunken); }
.aw-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; font-size: .78rem; color: var(--muted); }
.aw-save[data-s="ok"] { color: var(--ok); }
.aw-save[data-s="err"] { color: var(--bad); font-weight: 600; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: .74rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); text-decoration: none; white-space: nowrap; background: var(--surface); }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid currentColor; }
.chip[data-st="confirme"] { color: var(--ok); background: var(--ok-soft); border-color: transparent; }
.chip[data-st="a_corriger"] { color: var(--bad); background: var(--bad-soft); border-color: transparent; }
.chip[data-st="question"] { color: var(--ask); background: var(--ask-soft); border-color: transparent; }
.chip[data-st]:not([data-st=""])::before { background: currentColor; }
.prog { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--sunken); }
.prog i { display: block; height: 100%; }
.prog .p-ok { background: var(--ok); } .prog .p-bad { background: var(--bad); } .prog .p-ask { background: var(--ask); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .85rem; font-variant-numeric: tabular-nums; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; background: var(--sunken); border: 1px solid var(--line-strong); }
.legend .l-ok { background: var(--ok); border-color: var(--ok); } .legend .l-bad { background: var(--bad); border-color: var(--bad); } .legend .l-ask { background: var(--ask); border-color: var(--ask); }
.note { padding: 12px 14px; border-radius: var(--r); background: var(--accent-soft); font-size: .88rem; display: grid; gap: 4px; }
.note.w { background: var(--ask-soft); }
.note.e { background: var(--bad-soft); color: var(--ink); }
.aitem > *, .aw > *, .rel .node > * { min-width: 0; }
.aitem { display: grid; gap: 8px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.aitem:last-child { border-bottom: 0; }
.aitem .h { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.aitem .h a { font-family: var(--f-mono); font-weight: 600; font-size: .9rem; overflow-wrap: anywhere; }
.agroup { font-family: var(--f-cond); font-size: 1.05rem; font-weight: 600; padding: 14px 0 4px; border-bottom: 2px solid var(--ink); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.agroup span { font-family: var(--f-sans); font-size: .8rem; color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.modprog td:first-child { min-width: 130px; }
.modprog tr { cursor: pointer; }
.modprog tr:hover td { background: var(--sunken); }
.modprog .bar-cell { min-width: 120px; }

/* Chargement */
.loading { min-height: 60vh; display: grid; place-items: center; text-align: center; }
.loading .box { display: grid; gap: 14px; justify-items: center; max-width: 340px; }
.loading svg { color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { .loading svg { animation: spin 3s linear infinite; } }
@keyframes spin { to { transform: rotate(360deg); } }
.loadbar { width: 240px; height: 4px; background: var(--sunken); border-radius: 4px; overflow: hidden; }
.loadbar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }
.hits h3 { margin: 6px 0 6px; display: flex; justify-content: space-between; gap: 8px; }
.hits mark { background: var(--ask-soft); color: inherit; border-radius: 2px; }
.mt { margin-top: 10px; }

@media (max-width: 860px) {
  .chap { grid-template-columns: 1fr; }
  .toc { position: static; display: flex; overflow-x: auto; gap: 4px; padding-bottom: 4px; }
  .toc a { flex: none; white-space: nowrap; border: 1px solid var(--line); }
  .toc .sub { display: none; }
  .rel { grid-template-columns: 1fr; }
  .brand span, .dbstate b { display: none; }
  .bar { flex-wrap: wrap; }
  .search { order: 3; flex-basis: 100%; max-width: none; }
  .dbstate { margin-left: auto; }
}
@media (max-width: 520px) {
  h1 { font-size: 1.5rem; }
  .brand b { font-size: .95rem; }
  .kv { grid-template-columns: minmax(0, 1fr); gap: 0 0; }
  .kv dd { margin-bottom: 6px; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
</style>

<header class="top">
  <div class="gut"><div class="inner">
    <div class="bar">

        <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="13" cy="13" r="7.5"/><circle cx="13" cy="13" r="3.2"/><path d="M13 1v24M1 13h24"/></svg>
        <b>Guide technique</b><span>Succès Imprim</span>
      </a>
      <div class="search">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="m11 11 4 4"/></svg>
        <input id="q" type="search" placeholder="Chercher une classe, une table, une route, un chapitre…" autocomplete="off" aria-label="Chercher dans le guide">
      </div>

</header>
<main class="gut"><div class="inner" id="app">
  <div class="loading" id="loading"><div class="box">

<script>
(() => {

applyTheme(theme);
$('#theme').addEventListener('click', () => { theme = themes[(themes.indexOf(theme) + 1) % 3]; applyTheme(theme); store.set('theme', theme); });

/* ---------- Données ---------- */
let G = null;
const I = {};
const STATUTS = { confirme: 'Confirmé', a_corriger: 'À corriger', question: 'Question' };
const TYPES = { controleur: 'Contrôleurs', entite: 'Tables', route: 'Routes', securite: 'Sécurité', commande: 'Commandes' };

function anchors(list, key, label) {
  const byKey = new Map(), byA = new Map();
  for (const it of list) {

    let b = a, i = 2;
    while (byA.has(b)) b = a + '-' + (i++);

}

function index() {
  I.mod = new Map(G.modules.map(m => [m.cle, m]));
  I.modOrder = new Map(G.modules.map((m, i) => [m.cle, i]));
  I.ent = new Map(G.entites.map(e => [e.classe, e]));

  I.route = new Map(G.routes.map(r => [r.nom, r]));
  I.routeA = anchors(G.routes, r => r.nom, r => r.nom);
  I.ctrl = new Map(G.controleurs.map(c => [c.classe, c]));
  I.ctrlA = anchors(G.controleurs, c => c.classe, c => short(c.classe));
  I.svc = new Map(G.services.map(s => [s.classe, s]));
  I.svcA = anchors(G.services, s => s.classe, s => short(s.classe));
  I.cmd = new Map(G.commandes.map(c => [c.nom, c]));
  I.cmdA = anchors(G.commandes, c => c.nom, c => c.nom.replace(/^app:/, ''));
  I.mec = new Map(G.securite.mecanismes.map(m => [m.cle, m]));
  I.mecA = anchors(G.securite.mecanismes, m => m.cle, m => m.cle);
  I.audit = new Map(G.audit.map(a => [a.id, a]));
  I.shortName = new Map();
  for (const [map, A, pre] of [[I.ent, I.entA, 'table'], [I.ctrl, I.ctrlA, 'controleur'], [I.svc, I.svcA, 'service']]) {
    for (const k of map.keys()) { const s = short(k); if (!I.shortName.has(s)) I.shortName.set(s, '#' + pre + '-' + A.byKey.get(k)); }
  }
  I.incoming = new Map();
  for (const e of G.entites) for (const r of e.relations || []) {
    if (!I.incoming.has(r.cible)) I.incoming.set(r.cible, []);
    I.incoming.get(r.cible).push({ from: e, rel: r });
  }
  I.chargee = new Map();
  for (const c of G.controleurs) for (const e of c.entites_chargees || []) {
    if (!I.chargee.has(e)) I.chargee.set(e, []); I.chargee.get(e).push(c);
  }
  I.syncType = new Map(G.synchro.types.map(t => [t.classe, t]));
}
const hEnt = c => I.entA.byKey.has(c) ? '#table-' + I.entA.byKey.get(c) : null;
const hRoute = nm => I.routeA.byKey.has(nm) ? '#route-' + I.routeA.byKey.get(nm) : null;

const lnk = (href, txt, cls = 'mono') => href ? `<a class="${cls}" href="${href}">${esc(txt)}</a>` : `<span class="${cls}">${esc(txt)}</span>`;
const entLink = c => lnk(hEnt(c), short(c));
const ctrlAction = ca => { const [c, m] = String(ca).split('::'); return I.ctrl.has(c) ? `<a class="mono" href="${hCtrl(c)}">${esc(short(c))}</a><span class="mono dim">${m ? '::' + esc(m) : ''}</span>` : `<span class="mono">${esc(ca)}</span>`; };
const anyClass = c => hEnt(c) ? entLink(c) : hCtrl(c) ? lnk(hCtrl(c), short(c)) : hSvc(c) ? lnk(hSvc(c), short(c)) : `<span class="mono" title="${esc(c)}">${esc(short(c))}</span>`;
const modTag = k => k ? `<a class="tag m" href="#module-${esc(k)}">${esc(I.mod.get(k)?.libelle || k)}</a>` : '';
function auditHref(a) {
  const k = a.id.slice(a.id.indexOf(':') + 1);
  if (a.type === 'route') return hRoute(k) || '#routes';
  if (a.type === 'controleur') return hCtrl(k) || '#controleurs';

}

/* ---------- Audit : état partagé ---------- */
const A = {
  db: null, user: null, uid: null, col: null, unsub: null,
  phase: 'wait',           // wait | on | off (pas de base) | ro (lecture seule)
  roMsg: '', err: '',
  server: new Map(),       // item -> doc
  local: new Map(),        // item -> doc en cours d'écriture (null = suppression)
  saveSt: new Map(),       // item -> {s, msg}
  q: new Map(),            // item -> {busy, next}
  drafts: new Map(), timers: new Map()
};
const cur = id => A.local.has(id) ? A.local.get(id) : (A.server.get(id) || null);
const statutOf = id => cur(id)?.statut || '';
const canWrite = () => A.phase === 'on';
function docIdOf(item) {
  const bytes = new TextEncoder().encode(item);
  let bin = ''; for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function setDbState() {
  const el = $('#dbstate');
  const t = { wait: 'Audit : connexion…', on: 'Audit : enregistré en ligne', off: 'Audit : lecture seule', ro: 'Audit : lecture seule' }[A.phase];
  el.dataset.s = A.phase === 'on' ? 'on' : A.phase === 'wait' ? 'off' : 'ro';
  el.querySelector('b').textContent = t;
  el.title = A.phase === 'off' ? "Connectez-vous à claude.ai pour enregistrer l'audit" : (A.roMsg || t);
}

function counts(items) {
  const c = { total: items.length, confirme: 0, a_corriger: 0, question: 0, vus: 0 };
  for (const a of items) { const s = statutOf(a.id); if (s && c[s] != null) { c[s]++; c.vus++; } }
  return c;
}
function progHtml(c) {
  const p = k => c.total ? (100 * c[k] / c.total).toFixed(2) : 0;
  return `<div class="prog" role="img" aria-label="${n(c.vus)} sur ${n(c.total)} points vus"><i class="p-ok" style="width:${p('confirme')}%"></i><i class="p-bad" style="width:${p('a_corriger')}%"></i><i class="p-ask" style="width:${p('question')}%"></i></div>`;
}
const pct = c => c.total ? Math.round(100 * c.vus / c.total) : 0;
function legendHtml(c) {
  return `<div class="legend"><span><i class="l-ok"></i>Confirmés <b>${n(c.confirme)}</b></span><span><i class="l-bad"></i>À corriger <b>${n(c.a_corriger)}</b></span><span><i class="l-ask"></i>Questions <b>${n(c.question)}</b></span><span><i></i>Non vus <b>${n(c.total - c.vus)}</b></span><span>Fait <b>${pct(c)} %</b></span></div>`;
}

function chipHtml(id) {
  if (!I.audit.has(id)) return '';
  const s = statutOf(id);
  return `<a class="chip" data-aid="${esc(id)}" data-st="${s}" href="${auditHref(I.audit.get(id))}" title="Point d'audit">${s ? STATUTS[s] : 'Non vu'}</a>`;
}
function awHtml(id, opts = {}) {
  const a = I.audit.get(id);
  if (!a) return '';
  const did = docIdOf(id);
  const head = opts.compact ? '' : `<div class="aw-top"><span class="eyebrow">Point d'audit</span><span class="mono small dim">${esc(id)}</span></div><p class="aw-q">${esc(a.quoi_verifier)}</p>`;
  return `<div class="aw" data-aid="${esc(id)}" data-st="">${head}
    <div class="seg" role="group" aria-label="Réponse">${Object.entries(STATUTS).map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="false">${l}</button>`).join('')}</div>
    <textarea id="com-${did}" rows="2" placeholder="Commentaire (ce qui a été vérifié, ce qu'il faut corriger, la question)" aria-label="Commentaire"></textarea>
    <div class="aw-foot"><span class="aw-who"></span><span class="aw-save" aria-live="polite"></span></div>
  </div>`;
}
function paintAudit(root) {
  const els = $$('[data-aid]', root);
  for (const el of els) paintOne(el);
  fillWho(root);
}
function paintOne(el) {
  const id = el.dataset.aid, d = cur(id), s = d?.statut || '';
  el.dataset.st = s;
  if (el.classList.contains('chip')) { el.textContent = s ? STATUTS[s] : 'Non vu'; return; }
  const ro = !canWrite();
  for (const b of $$('.seg button', el)) { b.setAttribute('aria-pressed', String(b.dataset.v === s)); b.disabled = ro; b.title = ro ? (A.phase === 'off' ? "Connectez-vous à claude.ai pour enregistrer l'audit" : A.phase === 'wait' ? 'Connexion à la base de l’audit…' : A.roMsg) : ''; }
  const ta = $('textarea', el);
  ta.readOnly = ro;
  if (document.activeElement !== ta && !A.drafts.has(id)) ta.value = d?.commentaire || '';
  const who = $('.aw-who', el);
  if (d && d.par) who.innerHTML = `${s ? esc(STATUTS[s]) : 'Commentaire'} · <span data-who="${esc(d.par)}">…</span> · ${esc(dateCourte(d.le))}`;
  else if (d) who.textContent = `${s ? STATUTS[s] : 'Commentaire'} · ${dateCourte(d.le)}`;
  else who.textContent = A.phase === 'wait' ? 'Chargement des réponses…' : 'Pas encore de réponse';
  const sv = $('.aw-save', el), st = A.saveSt.get(id);
  sv.dataset.s = st ? st.s : '';
  sv.textContent = st ? st.msg : (A.phase === 'off' ? "Connectez-vous à claude.ai pour enregistrer l'audit" : A.phase === 'ro' ? 'Lecture seule' : '');
}
async function fillWho(root) {
  const els = $$('[data-who]', root);
  if (!els.length) return;
  const ids = [...new Set(els.map(e => e.dataset.who))];
  let ps = {};
  try { if (A.user) ps = await A.user.profiles(ids); } catch (e) { ps = {}; }
  for (const e of els) { const p = ps[e.dataset.who]; e.textContent = p ? (p.isMe ? 'vous' : (p.name || 'Quelqu\'un')) : 'Quelqu\'un'; }
}
let progTimer = 0;
function refreshItem(id) {
  for (const el of $$(`[data-aid="${CSS.escape(id)}"]`)) paintOne(el);
  fillWho($('#app'));
  if (!progTimer) progTimer = requestAnimationFrame(() => { progTimer = 0; refreshProgress(); });
}
function refreshProgress() {
  for (const el of $$('[data-prog]')) {
    const key = el.dataset.prog;
    const items = key === 'all' ? G.audit : key.startsWith('mod:') ? G.audit.filter(a => a.module === key.slice(4)) : [];
    const c = counts(items);
    el.innerHTML = progHtml(c) + (el.dataset.legend ? legendHtml(c) : `<div class="small dim">${n(c.vus)} / ${n(c.total)} vus · ${pct(c)} %</div>`);
  }
  const t = $('#modprog'); if (t) t.innerHTML = modProgRows();
  const r = $('#retires'); if (r) { r.innerHTML = retiresHtml(); fillWho(r); }
  const pc = $('#pillcounts'); if (pc) pc.innerHTML = statPills();
}

/* écriture : une à la fois par document, seulement sur changement */
function commit(id, statut, commentaire) {
  if (!canWrite()) return;
  const before = cur(id);
  if ((before?.statut || '') === (statut || '') && (before?.commentaire || '') === commentaire) return;
  const body = (statut || commentaire.trim()) ? { item: id, statut: statut || null, commentaire, par: A.uid, le: new Date().toISOString() } : null;
  A.local.set(id, body);
  A.saveSt.set(id, { s: '', msg: 'Enregistrement…' });
  refreshItem(id);
  const q = A.q.get(id) || { busy: false, next: undefined };
  q.next = body; A.q.set(id, q);
  if (!q.busy) pump(id, q);
}
async function pump(id, q) {
  q.busy = true;
  const ref = A.col.doc(docIdOf(id));
  while (q.next !== undefined) {
    const body = q.next; q.next = undefined;
    try {
      await writeOnce(ref, body);
      if (body) A.server.set(id, body); else A.server.delete(id);
      if (q.next === undefined) { A.local.delete(id); A.saveSt.set(id, { s: 'ok', msg: 'Enregistré' }); }
    } catch (e) {
      q.next = undefined; A.local.delete(id);
      A.saveSt.set(id, { s: 'err', msg: writeError(e) });
    }
    refreshItem(id);
  }
  q.busy = false;
}
async function writeOnce(ref, body) {
  try { return body ? await ref.set(body) : await ref.delete(); }
  catch (e) {
    if (e && e.code && !['unavailable', 'resource_exhausted'].includes(e.code) && ['invalid_argument', 'quota_exceeded', 'revoked', 'not_granted', 'capability_disabled', 'capability_removed', 'transform_error'].includes(e.code)) throw e;
    await new Promise(r => setTimeout(r, 400 + Math.random() * 900));
    return body ? await ref.set(body) : await ref.delete();
  }
}
function writeError(e) {
  const c = e && e.code;
  if (c === 'invalid_argument' || c === 'transform_error') { goReadOnly("Votre accès à cette page ne permet pas d'enregistrer l'audit : réponses en lecture seule."); return "Non enregistré : votre accès est en lecture seule."; }
  if (c === 'revoked' || c === 'not_granted' || c === 'capability_disabled' || c === 'capability_removed') { goReadOnly("L'enregistrement de l'audit n'est plus disponible sur cette page."); return 'Non enregistré : enregistrement indisponible.'; }
  if (c === 'quota_exceeded') return "Non enregistré : la base de l'audit est pleine. Prévenez la personne qui a publié le guide.";
  if (c === 'resource_exhausted') return 'Non enregistré : trop d’enregistrements d’un coup. Réessayez dans un instant.';
  return 'Non enregistré : connexion perdue. Réessayez.';
}
function goReadOnly(msg) {
  if (A.phase === 'ro') return;
  A.phase = 'ro'; A.roMsg = msg; setDbState();
  for (const el of $$('.aw[data-aid]')) paintOne(el);
  const b = $('#aud-banner'); if (b) b.innerHTML = bannerHtml();
}
function bannerHtml() {
  if (A.phase === 'off') return `<div class="note w"><b>Connectez-vous à claude.ai pour enregistrer l'audit.</b><span>Les points restent consultables ; les réponses déjà données s'affichent dès que la base est disponible.</span></div>`;
  if (A.phase === 'ro') return `<div class="note w"><b>Lecture seule.</b><span>${esc(A.roMsg)}</span></div>`;
  if (A.err) return `<div class="note e"><b>Réponses non synchronisées.</b><span>${esc(A.err)}</span></div>`;
  if (A.phase === 'wait') return `<div class="note"><span>Connexion à la base de l'audit…</span></div>`;
  return '';
}

document.addEventListener('click', e => {
  const b = e.target.closest('.aw .seg button');
  if (!b || b.disabled) return;
  const id = b.closest('.aw').dataset.aid;
  const d = cur(id), v = b.dataset.v;
  const com = A.drafts.has(id) ? A.drafts.get(id) : (d?.commentaire || '');
  A.drafts.delete(id); clearTimeout(A.timers.get(id));
  commit(id, d?.statut === v ? null : v, com);
});
document.addEventListener('input', e => {
  const ta = e.target.closest('.aw textarea');
  if (!ta) return;
  const id = ta.closest('.aw').dataset.aid;
  A.drafts.set(id, ta.value);
  clearTimeout(A.timers.get(id));
  A.timers.set(id, setTimeout(() => flushComment(id), 800));
  A.saveSt.set(id, { s: '', msg: 'Modifié…' });
  const sv = $('.aw-save', ta.closest('.aw')); sv.dataset.s = ''; sv.textContent = 'Modifié…';
});
document.addEventListener('focusout', e => {
  const ta = e.target.closest && e.target.closest('.aw textarea');
  if (ta) flushComment(ta.closest('.aw').dataset.aid);
});
function flushComment(id) {
  clearTimeout(A.timers.get(id)); A.timers.delete(id);
  if (!A.drafts.has(id)) return;
  const v = A.drafts.get(id); A.drafts.delete(id);
  const d = cur(id);
  if ((d?.commentaire || '') === v) { A.saveSt.delete(id); refreshItem(id); return; }
  commit(id, d?.statut || null, v);
}

async function startAudit() {
  let db = null, user = null;
  try { db = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('db') : null; } catch (e) { db = null; }
  try { user = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('user') : null; } catch (e) { user = null; }
  A.user = user;
  if (user) { try { A.uid = await user.id(); } catch (e) { A.uid = null; } }
  if (!db) { A.phase = 'off'; setDbState(); afterPhase(); return; }
  A.db = db; A.col = db.collection('audit');
  let w = null;
  if (user) { try { w = await user.can('data.write'); } catch (e) { w = null; } }
  if (w === false) { A.phase = 'ro'; A.roMsg = "Votre accès à cette page permet de lire l'audit, pas d'y répondre."; }
  else A.phase = 'on';
  setDbState();
  subscribe(0);
  afterPhase();
}
function subscribe(tries) {
  if (A.unsub) { try { A.unsub(); } catch (e) { } }
  A.unsub = A.col.onSnapshot(snap => {
    A.err = '';
    const changed = new Set();
    for (const ch of snap.docChanges()) {
      const d = ch.doc.data();
      const item = d && typeof d.item === 'string' ? d.item : null;
      if (!item) continue;
      if (ch.type === 'removed') A.server.delete(item); else A.server.set(item, d);
      changed.add(item);
    }
    if (changed.size > 60) { paintAudit($('#app')); refreshProgress(); }
    else for (const id of changed) refreshItem(id);
    const b = $('#aud-banner'); if (b) b.innerHTML = bannerHtml();
  }, err => {
    const c = err && err.code;
    if (c === 'revoked') { goReadOnly("L'accès à l'audit a été retiré pour cette page."); return; }
    A.err = c === 'resource_exhausted' ? 'Trop de lectures en même temps ; nouvel essai dans quelques secondes.' : 'La liaison avec la base a été coupée ; nouvel essai dans quelques secondes.';
    const b = $('#aud-banner'); if (b) b.innerHTML = bannerHtml();
    if (tries < 5) setTimeout(() => subscribe(tries + 1), 3000 * (tries + 1));
  });
}
function afterPhase() {
  paintAudit($('#app'));
  const b = $('#aud-banner'); if (b) b.innerHTML = bannerHtml();
  refreshProgress();
}

/* ---------- Navigation ---------- */
const TABS = [
  ['vue', "Vue d'ensemble"], ['chapitres', 'Chapitres'], ['modules', 'Modules'], ['tables', 'Tables', () => G.entites.length],
  ['routes', 'Routes', () => G.routes.length], ['controleurs', 'Contrôleurs', () => G.controleurs.length], ['services', 'Services', () => G.services.length],
  ['commandes', 'Commandes', () => G.commandes.length], ['droits', 'Droits'], ['securite', 'Sécurité'], ['synchro', 'Synchro'], ['reglages', 'Réglages'],
  ['audit', 'Audit', () => G.audit.length]
];
const SECTION_OF = { chapitre: 'chapitres', module: 'modules', table: 'tables', route: 'routes', controleur: 'controleurs', service: 'services', commande: 'commandes', mecanisme: 'securite' };
function renderTabs(active) {
  $('#tabs').innerHTML = TABS.map(([k, l, c]) => `<a href="#${k}"${k === active ? ' aria-current="page"' : ''}>${l}${c ? `<span class="n">${n(c())}</span>` : ''}</a>`).join('');
  const a = $('#tabs a[aria-current]'); if (a && a.scrollIntoView) { const t = $('#tabs'); t.scrollLeft = Math.max(0, a.offsetLeft - 40); }
}
let searchMode = false;
function route() {
  if (!G) return;
  const h = decodeURIComponent((location.hash || '#vue').slice(1)) || 'vue';
  const m = h.match(/^([a-z]+)-(.+)$/);
  const kind = m && SECTION_OF[m[1]] ? m[1] : null;
  const sec = kind ? SECTION_OF[kind] : h;
  searchMode = false;
  renderTabs(sec);
  const app = $('#app');
  let html;
  try {
    if (kind === 'chapitre') html = viewChapitre(m[2]);
    else if (kind === 'module') html = viewModule(m[2]);
    else if (kind === 'table') html = viewEntite(m[2]);
    else if (kind === 'route') html = viewRoute(m[2]);
    else if (kind === 'controleur') html = viewCtrl(m[2]);
    else if (kind === 'service') html = viewSvc(m[2]);
    else if (kind === 'commande') html = viewCmd(m[2]);
    else if (kind === 'mecanisme') html = viewSecurite();
    else html = (VIEWS[h] || VIEWS.vue)();
  } catch (e) { console.error(e); html = `<div class="note e">Cette partie du guide n'a pas pu s'afficher (${esc(e.message)}).</div>`; }
  app.innerHTML = `<div class="view">${html}</div>`;
  if (afterRender) { const f = afterRender; afterRender = null; f(app); }
  paintAudit(app); refreshProgress();
  if (kind === 'mecanisme') { const el = document.getElementById('mec-' + m[2]); if (el) el.scrollIntoView({ block: 'start' }); else scrollTo(0, 0); }
  else scrollTo(0, 0);
}
let afterRender = null;
window.addEventListener('hashchange', route);
const notFound = what => `<div class="note e"><b>${esc(what)} introuvable.</b><span>Le guide a peut-être été régénéré depuis ce lien. <a href="#vue">Retour à la vue d'ensemble</a>.</span></div>`;

/* ---------- Listes paresseuses ---------- */
function lazy(container, items, rowFn, opts = {}) {
  const chunk = opts.chunk || 100;
  let i = 0;
  const target = opts.tbody ? $('tbody', container) : container;
  const btn = document.createElement('button'); btn.className = 'more'; btn.type = 'button';
  container.after(btn);
  let io = null;
  const more = () => {
    const part = items.slice(i, i + chunk);
    target.insertAdjacentHTML('beforeend', part.map(rowFn).join(''));
    i += part.length;
    const left = items.length - i;
    btn.hidden = left <= 0;
    btn.textContent = `Afficher la suite (${n(left)} restant${left > 1 ? 's' : ''})`;
    paintAudit(target);
    if (left <= 0 && io) io.disconnect();
  };
  btn.addEventListener('click', more);
  more();
  if ('IntersectionObserver' in window && items.length > chunk) {
    io = new IntersectionObserver(es => { if (es.some(x => x.isIntersecting) && btn.isConnected && !btn.hidden) more(); }, { rootMargin: '600px' });
    io.observe(btn);
  }
  return btn;
}

}
const matchAll = (hay, q) => { const t = norm(q).split(/\s+/).filter(Boolean); if (!t.length) return true; const h = norm(hay); return t.every(x => h.includes(x)); };

const mdCache = new Map();
function renderMd(md) {
  if (mdCache.has(md)) return mdCache.get(md);
  let html;
  if (window.marked && window.DOMPurify) {
    html = DOMPurify.sanitize(marked.parse(md, { gfm: true }));
  } else {
    html = `<div class="note w">Mise en forme indisponible (bibliothèque non chargée) : texte brut.</div><pre style="white-space:pre-wrap">${esc(md)}</pre>`;
  }
  const box = document.createElement('div'); box.innerHTML = html;
  for (const pre of $$('pre > code.language-mermaid', box)) { const p = document.createElement('pre'); p.className = 'mermaid'; p.textContent = pre.textContent; pre.parentNode.replaceWith(p); }
  for (const t of $$('table', box)) { const w = document.createElement('div'); w.className = 'tbl'; t.replaceWith(w); w.appendChild(t); }
  for (const c of $$('code', box)) {
    if (c.closest('a') || c.closest('pre')) continue;
    const href = codeHref(c.textContent.trim());
    if (href) { const a = document.createElement('a'); a.href = href; c.replaceWith(a); a.appendChild(c); }
  }
  let k = 0; for (const h of $$('h2, h3', box)) h.id = 'h' + (k++);
  html = box.innerHTML; mdCache.set(md, html); return html;
}
function codeHref(t) {
  if (!t || t.length > 120) return null;
  if (I.route.has(t)) return hRoute(t);
  const first = t.split(/\s+/)[0];
  if (I.route.has(first)) return hRoute(first);
  if (I.cmd.has(t)) return hCmd(t);
  const cls = t.split('::')[0].replace(/\(\)$/, '');
  if (I.shortName.has(short(cls))) return I.shortName.get(short(cls));
  if (I.tbl.has(t)) return hEnt(I.tbl.get(t).classe);
  return null;
}
VIEWS.chapitres = () => viewChapitre(G.chapitres[0].id);
function viewChapitre(id) {
  const c = G.chapitres.find(x => x.id === id);
  if (!c) return notFound('Chapitre');
  const body = renderMd(c.markdown);
  const subs = (c.markdown.match(/^## .+$/gm) || []).map((t, i) => [i, t.slice(3)]);
  const i = G.chapitres.indexOf(c), prev = G.chapitres[i - 1], next = G.chapitres[i + 1];
  afterRender = app => {
    let k = 0; const h2 = $$('.md h2, .md h3', app).filter(h => h.tagName === 'H2');
    $$('.toc .sub', app).forEach((a, j) => a.addEventListener('click', ev => { ev.preventDefault(); h2[j]?.scrollIntoView({ block: 'start' }); }));
  };
  return `<div class="chap">
    <nav class="toc" aria-label="Chapitres">${G.chapitres.map(x => `<a href="#chapitre-${esc(x.id)}"${x.id === id ? ' aria-current="page"' : ''}>${esc(x.titre)}</a>${x.id === id ? subs.map(([j, t]) => `<a class="sub" href="#chapitre-${esc(x.id)}">${esc(t)}</a>`).join('') : ''}`).join('')}</nav>
    <article class="md">${body}
      <p class="mt small dim" style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap">${prev ? `<a href="#chapitre-${esc(prev.id)}">← ${esc(prev.titre)}</a>` : '<span></span>'}${next ? `<a href="#chapitre-${esc(next.id)}">${esc(next.titre)} →</a>` : ''}</p>
    </article></div>`;
}

  if (r.csrf) return `<span class="tag g" title="${esc(r.csrf_detail || '')}">jeton</span>`;
  if (r.csrf_detail) return `<span class="small dim" title="${esc(r.csrf_detail)}">sans objet</span>`;
  return '<span class="dim">—</span>';
}
function routeRow(r) {
  return `<tr><td><a class="mono" href="${hRoute(r.nom)}">${esc(r.nom)}</a><div class="mono small dim">${esc(r.chemin)}</div></td><td class="nw">${(r.methodes.length ? r.methodes : ['tous']).map(m => `<span class="tag">${esc(m)}</span>`).join(' ')}</td><td class="small">${ctrlAction(r.controleur)}</td><td><div class="tags">${rolesOf(r).map(x => `<span class="tag">${esc(x)}</span>`).join('')}</div><div class="small dim">${esc(r.acces?.pare_feu || '')}</div></td><td>${csrfCell(r)}</td><td>${r.modifie_donnees ? '<span class="tag a">oui</span>' : '<span class="dim">non</span>'}</td><td>${r.public ? '<span class="tag w">public</span>' : ''}</td><td><div class="tags">${(r.sensibles || []).map(x => `<span class="tag">${esc(x.replace('_', ' '))}</span>`).join('')}</div></td><td>${chipHtml('route:' + r.nom)}</td></tr>`;
}
VIEWS.routes = () => {

    const draw = () => {
      const list = G.routes.filter(r => (!f.m || r.module === f.m) && (!f.mod || r.modifie_donnees) && (!f.pub || r.public) && (!f.sc || r.sans_csrf) && (!f.sens || (r.sensibles || []).length) && matchAll([r.nom, r.chemin, r.controleur, r.methodes.join(' '), rolesOf(r).join(' ')].join(' '), f.q));
      $('#rt-count', app).textContent = plural(list.length, 'route', 'routes');
      const t = $('#rt-list', app); $('tbody', t).innerHTML = ''; if (t.nextElementSibling?.classList.contains('more')) t.nextElementSibling.remove();
      lazy(t, list, routeRow, { tbody: true, chunk: 100 });

  <div class="filters"><input id="rt-q" type="search" placeholder="Filtrer par nom, adresse, contrôleur, rôle…" value="${esc(f.q)}" aria-label="Filtrer les routes">${modSelect('rt-m', f.m)}
  ${cb('rt-mod', 'mod', 'modifient')}${cb('rt-pub', 'pub', 'publiques')}${cb('rt-sc', 'sc', 'sans CSRF')}${cb('rt-sens', 'sens', 'sensibles')}<span class="count" id="rt-count"></span></div>
  ${routeTable('rt-list')}`;
};
function viewRoute(a) {

    ${ac.refus_dans_le_code?.length ? `<dt>Refus dans le code</dt><dd class="small">${ac.refus_dans_le_code.map(x => esc(typeof x === 'string' ? x : JSON.stringify(x))).join('<br>')}</dd>` : ''}
    ${ac.verifications_dans_le_code?.length ? `<dt>Vérifications</dt><dd class="small">${ac.verifications_dans_le_code.map(x => esc(typeof x === 'string' ? x : JSON.stringify(x))).join('<br>')}</dd>` : ''}

  <div class="tbl"><table><thead><tr><th>Droit</th><th></th>${roles.map(r => `<th class="num" title="${esc(r.code)}">${esc(r.nom)}</th>`).join('')}</tr></thead><tbody>${mx}</tbody></table></div>

    <div class="panel"><h3>Montants masquables</h3><div class="tags">${(d.montants_masquables || []).map(x => `<span class="tag">${esc(x)}</span>`).join('')}</div></div>

/* ---------- Sécurité ---------- */
function viewSecurite() {
  const S = G.securite;
  const groupesMec = {};
  for (const m of S.mecanismes) { const k = m.cle.split(':')[0]; (groupesMec[k] = groupesMec[k] || []).push(m); }
  const lblMec = { config: 'Configuration', limiteur: 'Limiteurs de débit', fichier: 'Fichiers', classe: 'Classes de sécurité', souscripteur: 'Souscripteurs', ecouteur: 'Écouteurs' };
  const kvObj = o => `<dl class="kv">${Object.entries(o || {}).map(([k, v]) => `<dt class="mono small">${esc(k)}</dt><dd class="mono small">${esc(typeof v === 'string' ? v : JSON.stringify(v))}</dd>`).join('')}</dl>`;

/* ---------- Audit ---------- */
const AF = Object.assign({ statut: 'tous', type: '', module: '', q: '' }, store.get('audit', {}));
function auditFiltered() {
  return G.audit.filter(a => {
    if (AF.type && a.type !== AF.type) return false;
    if (AF.module && a.module !== AF.module) return false;
    const s = statutOf(a.id);
    if (AF.statut === 'nonvus' && s) return false;
    if (['confirme', 'a_corriger', 'question'].includes(AF.statut) && s !== AF.statut) return false;
    if (AF.q && !matchAll([a.id, a.titre, a.quoi_verifier, a.fichier, cur(a.id)?.commentaire || ''].join(' '), AF.q)) return false;
    return true;
  }).sort((x, y) => (I.modOrder.get(x.module) ?? 99) - (I.modOrder.get(y.module) ?? 99) || Object.keys(TYPES).indexOf(x.type) - Object.keys(TYPES).indexOf(y.type));
}
function statPills() {
  const scope = G.audit.filter(a => (!AF.type || a.type === AF.type) && (!AF.module || a.module === AF.module));
  const c = counts(scope);
  const opts = [['tous', 'Tous', c.total], ['nonvus', 'Non vus', c.total - c.vus], ['confirme', 'Confirmés', c.confirme], ['a_corriger', 'À corriger', c.a_corriger], ['question', 'Questions', c.question]];
  return opts.map(([k, l, v]) => `<button type="button" class="pill" data-st="${k}" aria-pressed="${AF.statut === k}">${l} · ${n(v)}</button>`).join('');
}
function modProgRows() {
  return G.modules.map(m => { const c = counts(G.audit.filter(a => a.module === m.cle)); return c.total ? `<tr data-mod="${esc(m.cle)}"${AF.module === m.cle ? ' style="font-weight:600"' : ''}><td>${esc(m.libelle)}</td><td class="num">${n(c.total)}</td><td class="num">${n(c.confirme)}</td><td class="num">${n(c.a_corriger)}</td><td class="num">${n(c.question)}</td><td class="num">${n(c.total - c.vus)}</td><td class="bar-cell">${progHtml(c)}</td><td class="num">${pct(c)} %</td></tr>` : ''; }).join('');
}

}

/* ---------- Recherche globale ---------- */
let SIDX = null;
function buildSearch() {
  SIDX = [];
  const add = (kind, label, sub, href, text) => SIDX.push({ kind, label, sub, href, t: norm(text) });
  for (const c of G.chapitres) {
    const parts = c.markdown.split(/\n(?=## )/);
    parts.forEach((p, i) => add('Chapitres', c.titre + (i ? ' › ' + p.split('\n')[0].replace(/^## /, '') : ''), '', '#chapitre-' + c.id, p));
  }
  for (const e of G.entites) add('Tables', short(e.classe), e.table + ' · ' + (e.role || ''), hEnt(e.classe), [e.classe, e.table, e.role, e.champs.map(c => c.nom + ' ' + c.colonne).join(' ')].join(' '));
  for (const r of G.routes) add('Routes', r.nom, r.methodes.join(',') + ' ' + r.chemin, hRoute(r.nom), [r.nom, r.chemin, r.controleur].join(' '));
  for (const c of G.controleurs) add('Contrôleurs', short(c.classe), c.resume, hCtrl(c.classe), [c.classe, c.resume].join(' '));
  for (const s of G.services) add('Services', short(s.classe), s.resume, hSvc(s.classe), [s.classe, s.resume, (s.methodes_publiques || []).map(m => m.nom).join(' ')].join(' '));
  for (const c of G.commandes) add('Commandes', c.nom, c.description, hCmd(c.nom), [c.nom, c.description, c.resume].join(' '));
  for (const d of G.droits.catalogue) add('Droits', d.code, d.libelle + ' · ' + (d.description || ''), '#droits', [d.code, d.libelle, d.description].join(' '));
  for (const m of G.securite.mecanismes) add('Sécurité', m.titre, m.resume, hMec(m.cle), [m.cle, m.titre, m.resume, m.fichier].join(' '));
  for (const t of G.parametres.tuiles) add('Réglages', t.libelle, (t.champs || []).map(c => c.libelle).join(', '), '#reglages', [t.libelle, t.tuile, (t.champs || []).map(c => c.libelle + ' ' + c.cle).join(' ')].join(' '));
}
function snippet(text, q) {
  const t = String(text || ''); if (!q) return esc(t.slice(0, 140));
  const terms = norm(q).split(/\s+/).filter(Boolean);
  const nt = norm(t); let i = nt.indexOf(terms[0]); if (i < 0) i = 0;
  const s = Math.max(0, i - 50), part = t.slice(s, s + 170);
  let h = esc(part);
  for (const x of terms) { const re = new RegExp('(' + x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'); h = h.replace(re, '<mark>$1</mark>'); }
  return (s ? '…' : '') + h + (s + 170 < t.length ? '…' : '');
}
function runSearch(q) {
  if (!G) return;
  if (!q.trim()) { if (searchMode) route(); return; }
  if (!SIDX) buildSearch();
  searchMode = true; renderTabs('');
  const terms = norm(q).split(/\s+/).filter(Boolean);
  const hits = SIDX.filter(x => terms.every(t => x.t.includes(t)));
  const by = {}; for (const h of hits) (by[h.kind] = by[h.kind] || []).push(h);
  const chapText = id => G.chapitres.find(c => '#chapitre-' + c.id === id)?.markdown || '';
  $('#app').innerHTML = `<div class="view"><div class="head"><span class="eyebrow">Recherche</span><h1>${plural(hits.length, 'résultat', 'résultats')} pour « ${esc(q)} »</h1></div>
  ${hits.length ? Object.entries(by).map(([k, list]) => `<div class="panel hits"><h3>${esc(k)} <span class="count">${n(list.length)}</span></h3><div class="list">${list.slice(0, 30).map(h => `<a class="row" href="${h.href}"><span class="t">${esc(h.label)}</span><span class="d">${snippet(k === 'Chapitres' ? chapText(h.href) : h.sub, q)}</span></a>`).join('')}</div>${list.length > 30 ? `<p class="small dim mt">et ${n(list.length - 30)} autres : affinez la recherche.</p>` : ''}</div>`).join('') : '<p class="dim">Rien trouvé. Essayez un nom de classe, de table (ex. <span class="mono">commandes</span>), de route ou un mot du chapitre.</p>'}</div>`;
  scrollTo(0, 0);
}
let qt = 0;
$('#q').addEventListener('input', e => { clearTimeout(qt); qt = setTimeout(() => runSearch(e.target.value), 180); });
$('#q').addEventListener('keydown', e => { if (e.key === 'Escape') { e.target.value = ''; runSearch(''); } });
document.addEventListener('click', e => { const a = e.target.closest('a[href^="#"]'); if (a && searchMode) { $('#q').value = ''; if (a.getAttribute('href') === location.hash) route(); } });

/* ---------- Démarrage ---------- */
async function load() {
  const bar = $('#loadbar'), txt = $('#loadtxt');
  try {
    const res = await fetch('guide.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const total = +res.headers.get('content-length') || 0;
    let text;
    if (res.body && res.body.getReader) {
      const rd = res.body.getReader(), chunks = []; let got = 0;
      for (;;) {
        const { done, value } = await rd.read(); if (done) break;
        chunks.push(value); got += value.length;
        bar.style.width = total ? Math.min(100, 100 * got / total) + '%' : Math.min(95, got / 50000) + '%';
        txt.textContent = `Lecture de guide.json : ${(got / 1048576).toLocaleString('fr-FR', { maximumFractionDigits: 1 })} Mo${total ? ' sur ' + (total / 1048576).toLocaleString('fr-FR', { maximumFractionDigits: 1 }) + ' Mo' : ''}`;
      }
      const all = new Uint8Array(got); let o = 0; for (const c of chunks) { all.set(c, o); o += c.length; }
      text = new TextDecoder().decode(all);
    } else text = await res.text();
    G = JSON.parse(text);
  } catch (e) {
    $('#app').innerHTML = `<div class="loading"><div class="box"><h2>Le guide n'a pas pu être chargé</h2><p class="dim">guide.json est introuvable ou illisible (${esc(e.message)}). Il doit être publié à côté de cette page.</p></div></div>`;
    return;
  }
  index();
  route();
  startAudit();
}
load();
})();
</script>
