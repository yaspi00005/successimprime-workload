name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Lint et tests (PHP 8.4)
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv, intl, gd, zip, pdo_mysql
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Installer les dependances
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Verifier le conteneur de services
        run: php bin/console lint:container

      - name: Verifier les gabarits Twig
        run: php bin/console lint:twig templates

      - name: Verifier la configuration YAML
        run: php bin/console lint:yaml config --parse-tags

      - name: Tests automatises
        run: php vendor/bin/phpunit
