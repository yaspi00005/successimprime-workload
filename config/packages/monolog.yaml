monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists

# Alertes système (docs/alertes-systeme.md) : les erreurs du journal (Orange Money, SMS, tâches
# planifiées, file de messages, autres) deviennent des alertes, regroupées et envoyées à la
# direction et au technicien. Le handler décide lui-même de ce qu'il garde et ne bloque jamais
# les autres (il rend toujours la main).
when@dev:
    monolog:
        handlers:
            alertes_systeme:
                type: service
                id: App\Service\Alertes\AlertesMonologHandler
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            alertes_systeme:
                type: service
                id: App\Service\Alertes\AlertesMonologHandler
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!deprecation"]
            # Les avis « User Deprecated » ne s'affichent plus après chaque commande du serveur
            # (docs/deploiement.md) : ils vont dans var/log/deprecations-AAAA-MM-JJ.log, 3 jours gardés.
            # Ils servent à préparer une mise à jour de Symfony, Twig ou Doctrine ; la plupart ne
            # paraissent qu'à la préparation du cache, les fichiers restent donc petits.
            deprecation:
                type: rotating_file
                channels: [deprecation]
                path: "%kernel.logs_dir%/deprecations.log"
                max_files: 3
