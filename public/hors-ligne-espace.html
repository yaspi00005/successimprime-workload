<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="robots" content="noindex">
	<meta name="theme-color" content="#F4F6FA">
	<title>Pas de connexion · Succès Imprim</title>
	<!--
		Page montrée par sw.js quand une page de l'espace client ne peut pas
		s'ouvrir faute de réseau (application de l'écran d'accueil). Gardée
		dans le téléphone : aucune donnée de client, tout est dans la page.
	-->
	<style>
		* { box-sizing: border-box; }
		html, body { margin: 0; }
		body { min-height: 100vh; display: grid; place-items: center; padding: 1.5rem 1rem; background: #F4F6FA; color: #12213A; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
		main { width: 100%; max-width: 380px; padding: 2rem 1.4rem 1.6rem; border-radius: 22px; background: #fff; text-align: center; box-shadow: 0 1px 3px rgba(18,33,58,.06); }
		.marque { font-size: 1.3rem; font-weight: 900; font-style: italic; letter-spacing: -.01em; color: #0F4590; }
		.marque span { color: #E0102B; }
		svg { display: block; width: 56px; height: 56px; margin: 1.3rem auto .6rem; fill: none; stroke: #6B7385; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
		h1 { margin: 0 0 .4rem; font-size: 1.25rem; font-weight: 800; }
		p { margin: 0 0 1.3rem; color: #6B7385; }
		button { width: 100%; min-height: 48px; border: 0; border-radius: 14px; background: #0F4590; color: #fff; font: inherit; font-weight: 800; cursor: pointer; }
		button:focus-visible { outline: 3px solid #F5B400; outline-offset: 2px; }
	</style>
</head>
<body>
	<main>
		<div class="marque">Succès <span>Imprim</span></div>
		<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 8.5a15 15 0 0 1 20 0M5.5 12a10 10 0 0 1 13 0M9 15.5a5 5 0 0 1 6 0M12 19h.01M3 3l18 18"/></svg>
		<h1>Pas de connexion internet</h1>
		<p>Votre espace client s'ouvrira dès que le téléphone retrouvera le réseau.</p>
		<button type="button" id="reessayer">Réessayer</button>
	</main>
	<script>
		document.getElementById('reessayer').addEventListener('click', function () { location.reload(); });
		window.addEventListener('online', function () { location.reload(); });
	</script>
</body>
</html>
