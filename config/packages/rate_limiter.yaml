framework:
    rate_limiter:
        # Codes de connexion (espace client CX01, administration en ligne
        # CX03) : les SMS coûtent, et ni un numéro ni une adresse e-mail ne
        # doivent être bombardés de codes. Clés : usage + numéro, usage +
        # adresse e-mail (CodeDeConnexion), usage + adresse IP. Les essais
        # d'un code d'accès reçu par WhatsApp comptent aussi.
        code_connexion_destinataire:
            policy: sliding_window
            limit: 3
            interval: '15 minutes'
        code_connexion_ip:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        # Suivi d'une commande sans compte : freine les essais de numéros.
        espace_suivi_ip:
            policy: sliding_window
            limit: 20
            interval: '1 hour'
        # Sondages sans compte (lien de livraison, QR code) : freine les
        # réponses en rafale depuis une même connexion.
        sondage_public_ip:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        # Site vitrine (maquette 11) : demandes de devis et messages sans compte.
        site_demande_ip:
            policy: sliding_window
            limit: 6
            interval: '1 hour'
        # Accusé de réception par SMS : le numéro a été tapé par un inconnu,
        # il n'en reçoit pas plus de 3 par jour.
        site_accuse_telephone:
            policy: sliding_window
            limit: 3
            interval: '1 day'
        # Messages de l'espace client à l'atelier (maquette EC01) : une
        # personne n'en envoie pas plus de 10 par heure.
        espace_message_compte:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        # Assistant du site et de l'espace client (docs/assistant-client.md) :
        # chaque question coûte un appel à l'API. Les connexions mobiles
        # partagent souvent une adresse : la limite par adresse reste large,
        # le plafond de dépense du jour (Réglages) tient le reste.
        assistant_ip:
            policy: sliding_window
            limit: 120
            interval: '1 hour'
        assistant_conversation:
            policy: sliding_window
            limit: 20
            interval: '1 hour'
        assistant_compte:
            policy: sliding_window
            limit: 40
            interval: '1 hour'
        # Demandes de devis préparées par l'assistant dans l'espace client.
        assistant_devis_compte:
            policy: sliding_window
            limit: 3
            interval: '1 hour'
