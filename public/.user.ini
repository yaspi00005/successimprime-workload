; Hébergement mutualisé (PHP-FPM ou CGI) : fichiers d'impression des clients
; jusqu'à 64 Mo. Ignoré par XAMPP (mod_php), où php.ini garde la main.
upload_max_filesize = 64M
post_max_size = 64M

; Aucune erreur PHP affichée aux visiteurs (chemins de fichiers, requêtes) :
; elles vont dans le journal du serveur (docs/securite.md). Symfony affiche
; déjà ses propres pages d'erreur sans détail en production.
display_errors = Off
log_errors = On
